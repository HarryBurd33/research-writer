name: Windows SSH acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/windows-ssh-acceptance.yml'
      - 'skills/research-writer/scripts/**'
      - 'evals/windows*'
      - 'evals/setup_windows_ssh_ci.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-ssh-acceptance.yml'
      - 'skills/research-writer/scripts/**'
      - 'evals/windows*'
      - 'evals/setup_windows_ssh_ci.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ssh-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  windows-ssh:
    name: Native Windows OpenSSH loopback
    runs-on: windows-2025
    timeout-minutes: 13
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select x64 Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Require the existing native Windows worker controls
        timeout-minutes: 3
        run: python evals/run_platform_acceptance.py windows
      - name: Require real pinned SSH roundtrip, recovery and process cleanup
        timeout-minutes: 8
        run: python evals/setup_windows_ssh_ci.py
