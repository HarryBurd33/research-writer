name: Research Writer CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-writer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            architecture: x64
          - os: ubuntu-latest
            python: "3.12"
            architecture: x64
          - os: windows-latest
            python: "3.10"
            architecture: x64
          - os: windows-latest
            python: "3.12"
            architecture: x64
          - os: macos-15-intel
            python: "3.10"
            architecture: x64
          - os: macos-latest
            python: "3.12"
            architecture: arm64
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Report actual runtime
        run: python -c "import platform, sys; print(sys.version); print(platform.platform(), platform.machine())"
      - name: Core toolkit checks (molecular explicitly skipped)
        run: python evals/toolkit_checks.py
      - name: Public adversarial regressions
        run: python evals/toolkit_regressions.py
      - name: Literature retrieval offline contracts
        run: python evals/literature_checks.py
      - name: Source-support record contracts
        run: python evals/support_checks.py
      - name: Deeper discovery and claim-inventory offline contracts
        run: |
          python evals/discovery_checks.py
          python evals/claim_audit_checks.py
      - name: Optional engine offline contracts
        run: |
          python evals/conversion_checks.py
          python evals/protein_checks.py
      - name: Remote client and worker contracts
        run: |
          python evals/remote_client_checks.py
          python evals/remote_worker_checks.py
          python evals/controller_recovery_checks.py
          python evals/linux_checks.py
          python evals/checkpoint_checks.py
          python evals/remote_loopback_checks.py
      - name: Workflow fixture arithmetic and integrity (no model evaluation)
        run: |
          python evals/workflow/reproduce_quantitative.py
          python evals/workflow_checks.py
      - name: Isolated installed-package smoke
        run: python evals/package_smoke.py --checkpoints
      - name: Portable bundle consistency
        run: python scripts/build_portable.py --check

  molecular:
    name: CPU molecular (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install selected CPU wheels (no models or GPU extras)
        run: |
          python -m pip install --only-binary=:all: -r extras/cpu-tested-requirements.txt
      - name: Report actual runtime and package versions
        run: python -c "import platform, sys, importlib.metadata as m; print(sys.version); print(platform.platform(), platform.machine()); print({p:m.version(p) for p in ('rdkit','OpenMM','numpy','pillow')})"
      - name: Toolkit checks with actual molecular controls
        run: python evals/toolkit_checks.py --molecular
      - name: Public regressions with actual molecular controls
        run: python evals/toolkit_regressions.py --molecular
      - name: Prepare isolated Open Babel runtime
        run: |
          python -m venv .venv-openbabel
          python -c "import os,pathlib,subprocess; b=pathlib.Path('.venv-openbabel')/('Scripts' if os.name=='nt' else 'bin'); subprocess.run([str(b/('python.exe' if os.name=='nt' else 'python')), '-m','pip','install','--only-binary=:all:','openbabel==3.2.1'],check=True)"
      - name: Actual independently checked conversions
        run: |
          python -c "import os,pathlib,subprocess,sys; b=pathlib.Path('.venv-openbabel')/('Scripts' if os.name=='nt' else 'bin'); e=str((b/('obabel.exe' if os.name=='nt' else 'obabel')).absolute()); subprocess.run([sys.executable,'evals/conversion_checks.py','--molecular','--executable',e],check=True); subprocess.run([sys.executable,'evals/package_smoke.py','--molecular','--obabel',e],check=True)"
      - name: Isolated installed-package molecular smoke
        run: python evals/package_smoke.py --molecular

  protein:
    name: CPU protein (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install selected CPU protein runtime
        run: |
          python -m pip install --only-binary=:all: torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: transformers==5.21.0
      - name: Explicitly prepare small pinned MIT model
        run: python skills/research-writer/scripts/protein_tools.py prepare-model --directory .model-assets --allow-download
      - name: Actual CPU representation and isolated install controls
        run: |
          python evals/protein_checks.py --protein --model-dir .model-assets
          python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'evals/package_smoke.py','--protein-python',sys.executable,'--protein-model-dir',str(pathlib.Path('.model-assets').absolute())],check=True)"

  remote:
    name: Loopback SSH (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Prepare ephemeral Linux privilege-separation directory
        if: runner.os == 'Linux'
        run: sudo install -d -m 0755 /run/sshd
      - name: Require disposable real SSH lifecycle controls
        run: python evals/remote_loopback_checks.py --run-ssh

  isolation:
    name: Linux isolation and recovery (Docker, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Explicitly provision disposable official Python image and record local identity
        shell: bash
        run: |
          docker --context default pull python:3.12-slim-bookworm
          docker --context default image inspect --format '{{.Id}} {{json .RepoDigests}}' python:3.12-slim-bookworm
      - name: Require actual Linux resource and interrupted-recovery controls
        shell: bash
        run: |
          IMAGE_ID=$(docker --context default image inspect --format '{{.Id}}' python:3.12-slim-bookworm)
          python evals/linux_integration_checks.py --docker "$(command -v docker)" --context default --image-id "$IMAGE_ID"
          python evals/durable_integration_checks.py --docker "$(command -v docker)" --context default --image-id "$IMAGE_ID"

  required:
    # Stable aggregate check name; do not rename when extending the matrix.
    name: Research Writer checks
    if: ${{ always() }}
    needs: [core, molecular, protein, remote, isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CORE_RESULT: ${{ needs.core.result }}
      MOLECULAR_RESULT: ${{ needs.molecular.result }}
      PROTEIN_RESULT: ${{ needs.protein.result }}
      REMOTE_RESULT: ${{ needs.remote.result }}
      ISOLATION_RESULT: ${{ needs.isolation.result }}
    steps:
      - name: Require every matrix job to pass
        shell: bash
        run: |
          test "$CORE_RESULT" = success
          test "$MOLECULAR_RESULT" = success
          test "$PROTEIN_RESULT" = success
          test "$REMOTE_RESULT" = success
          test "$ISOLATION_RESULT" = success
